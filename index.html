<style>
/* ===========================
   🔧 CSS 变量 — 一键修改配色
   =========================== */
:root {
  --bg: #f9f7f4;
  --bg-card: #ffffff;
  --text-primary: #3a3548;
  --text-secondary: #8b8598;
  --text-muted: #b5b0c0;
  --accent: #9b7ec4;
  --accent-light: #ede4f7;
  --accent-dark: #7b5ea7;
  --success: #7d9b76;
  --warning: #f4a460;
  --shadow-sm: 0 2px 12px rgba(60, 40, 80, 0.05);
  --shadow-md: 0 4px 24px rgba(60, 40, 80, 0.08);
  --shadow-lg: 0 8px 40px rgba(60, 40, 80, 0.12);
  --shadow-btn: 0 4px 16px rgba(155, 126, 196, 0.3);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --font-xs: 0.75rem;
  --font-sm: 0.875rem;
  --font-base: 1rem;
  --font-lg: 1.125rem;
  --font-xl: 1.5rem;
  --font-2xl: 2rem;
  --font-3xl: 2.5rem;
  --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --max-width: 560px;
}

/* ===========================
   全局基础样式
   =========================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  scroll-behavior: smooth;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===========================
   背景浮动光斑动画
   =========================== */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.12;
  z-index: -1;
  pointer-events: none;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

.bg-orb--1 {
  width: 360px;
  height: 360px;
  background: #e8c8d8;
  top: -80px;
  left: -100px;
  animation: float1 18s infinite;
}

.bg-orb--2 {
  width: 280px;
  height: 280px;
  background: #c8d8e8;
  bottom: -60px;
  right: -80px;
  animation: float2 22s infinite;
}

.bg-orb--3 {
  width: 300px;
  height: 300px;
  background: #d4d0c8;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: float3 20s infinite;
}

@keyframes float1 {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  25% { transform: translate(60px, 40px) rotate(3deg) scale(1.08); }
  50% { transform: translate(30px, -20px) rotate(-2deg) scale(0.95); }
  75% { transform: translate(-20px, -30px) rotate(1deg) scale(1.04); }
}

@keyframes float2 {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  33% { transform: translate(-40px, -30px) rotate(-3deg) scale(1.06); }
  66% { transform: translate(20px, 20px) rotate(2deg) scale(0.96); }
}

@keyframes float3 {
  0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  50% { transform: translate(-50%, -50%) rotate(5deg) scale(1.1); }
}

/* ===========================
   主容器
   =========================== */
.app-container {
  width: 100%;
  max-width: var(--max-width);
  padding: 24px 20px 40px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  position: relative;
}

/* ===========================
   页面切换动画
   =========================== */
.page {
  display: none;
  flex-direction: column;
  flex: 1;
  animation: pageIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.page.active {
  display: flex;
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===========================
   卡片通用样式
   =========================== */
.card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  box-shadow: var(--shadow-md);
  transition: var(--transition);
}

/* ===========================
   欢迎页样式
   =========================== */
.welcome-header {
  text-align: center;
  padding: 40px 0 20px;
}

.welcome-icon {
  font-size: 3.5rem;
  margin-bottom: 16px;
  animation: gentleBounce 2s ease-in-out infinite;
}

@keyframes gentleBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.welcome-title {
  font-size: var(--font-3xl);
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.02em;
  margin-bottom: 8px;
  line-height: 1.25;
}

.welcome-subtitle {
  font-size: var(--font-lg);
  color: var(--text-secondary);
  font-weight: 400;
  margin-bottom: 4px;
}

.welcome-highlights {
  display: flex;
  gap: 12px;
  margin: 28px 0;
  flex-wrap: wrap;
  justify-content: center;
}

.highlight-item {
  flex: 1 1 100px;
  min-width: 100px;
  max-width: 150px;
  text-align: center;
  padding: 16px 10px;
  background: var(--bg);
  border-radius: var(--radius-md);
  transition: var(--transition);
}

.highlight-item:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-sm);
}

.highlight-icon {
  font-size: 1.8rem;
  margin-bottom: 8px;
  display: block;
}

.highlight-text {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  line-height: 1.4;
}

.btn-start {
  display: block;
  width: 100%;
  max-width: 320px;
  margin: 20px auto 0;
  padding: 16px 32px;
  font-size: var(--font-lg);
  font-weight: 600;
  color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: var(--shadow-btn);
  transition: var(--transition);
  letter-spacing: 0.04em;
  position: relative;
  overflow: hidden;
}

.btn-start::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.btn-start:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(155, 126, 196, 0.4);
}

.btn-start:hover::after {
  opacity: 1;
}

.btn-start:active {
  transform: translateY(0) scale(0.98);
}

.welcome-footer {
  text-align: center;
  margin-top: auto;
  padding-top: 24px;
  font-size: var(--font-xs);
  color: var(--text-muted);
}

/* 欢迎页分享区 */
.welcome-share {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid #ece9f0;
}

[data-theme="dark"] .welcome-share {
  border-top-color: #353050;
}

.welcome-share-title {
  font-size: var(--font-sm);
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: 12px;
}

.welcome-qr-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 10px;
}

.welcome-qr-wrap img {
  width: 120px;
  height: 120px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  background: #fff;
  padding: 6px;
}

.welcome-share-hint {
  font-size: var(--font-xs);
  color: var(--text-muted);
}

/* 入场动画延迟 */
.anim-1 { animation: fadeInUp 0.6s 0.1s both; }
.anim-2 { animation: fadeInUp 0.6s 0.25s both; }
.anim-3 { animation: fadeInUp 0.6s 0.4s both; }
.anim-4 { animation: fadeInUp 0.6s 0.55s both; }
.anim-5 { animation: fadeInUp 0.6s 0.7s both; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===========================
   答题页样式
   =========================== */
.quiz-progress-wrap {
  margin-bottom: 20px;
}

.quiz-progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-size: var(--font-sm);
  color: var(--text-secondary);
}

.quiz-progress-bar {
  width: 100%;
  height: 6px;
  background: #e8e5ec;
  border-radius: 3px;
  overflow: hidden;
}

.quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-light), var(--accent));
  border-radius: 3px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.quiz-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  box-shadow: var(--shadow-md);
  transition: var(--transition);
  min-height: 320px;
}

.quiz-question-number {
  font-size: var(--font-sm);
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 0.05em;
}

.quiz-question-text {
  font-size: var(--font-xl);
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 24px;
  line-height: 1.45;
}

.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.quiz-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: var(--bg);
  border: 2px solid transparent;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  font-size: var(--font-base);
  color: var(--text-primary);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.quiz-option:hover {
  background: #f0edf5;
  border-color: #e0d8eb;
  transform: translateX(4px);
}

.quiz-option:active {
  transform: scale(0.98);
}

.quiz-option.selected {
  background: var(--accent-light);
  border-color: var(--accent);
  font-weight: 500;
  box-shadow: 0 2px 12px rgba(155, 126, 196, 0.15);
}

.quiz-option-icon {
  font-size: 1.3rem;
  flex-shrink: 0;
  transition: var(--transition);
}

.quiz-option:hover .quiz-option-icon {
  transform: scale(1.15);
}

.quiz-option-radio {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #d0ccd6;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.quiz-option.selected .quiz-option-radio {
  border-color: var(--accent);
  background: var(--accent);
}

.quiz-option.selected .quiz-option-radio::after {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
}

.quiz-nav {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.btn-nav {
  flex: 1;
  padding: 12px 20px;
  font-size: var(--font-base);
  font-weight: 500;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 0.03em;
}

.btn-prev {
  background: var(--bg);
  color: var(--text-secondary);
}

.btn-prev:hover {
  background: #e8e5ec;
}

.btn-prev:active {
  transform: scale(0.97);
}

.btn-next {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #fff;
  box-shadow: var(--shadow-btn);
}

.btn-next:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(155, 126, 196, 0.35);
}

.btn-next:active:not(:disabled) {
  transform: scale(0.97);
}

.btn-next:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
}

/* 切题动画 */
.quiz-card.slide-out-left {
  animation: slideOutLeft 0.25s ease-in forwards;
}

.quiz-card.slide-out-right {
  animation: slideOutRight 0.25s ease-in forwards;
}

.quiz-card.slide-in-left {
  animation: slideInLeft 0.3s ease-out forwards;
}

.quiz-card.slide-in-right {
  animation: slideInRight 0.3s ease-out forwards;
}

@keyframes slideOutLeft {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(-40px); }
}

@keyframes slideOutRight {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(40px); }
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-40px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes slideInRight {
  from { opacity: 0; transform: translateX(40px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ===========================
   结果页样式
   =========================== */
.result-hero {
  text-align: center;
  padding: 24px 0 8px;
}

.result-color-circle {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  margin: 0 auto 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  animation: resultPopIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes resultPopIn {
  from { opacity: 0; transform: scale(0.3); }
  to   { opacity: 1; transform: scale(1); }
}

.result-personality-name {
  font-size: var(--font-2xl);
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.result-tagline {
  font-size: var(--font-base);
  color: var(--text-secondary);
  font-weight: 400;
}

.result-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 16px 0;
}

.result-tag {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: var(--font-sm);
  font-weight: 500;
  letter-spacing: 0.02em;
}

.result-card {
  margin-bottom: 16px;
}

.result-card h3 {
  font-size: var(--font-lg);
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.result-card p {
  font-size: var(--font-base);
  color: var(--text-secondary);
  line-height: 1.75;
}

.result-card ul {
  list-style: none;
  padding: 0;
}

.result-card ul li {
  padding: 6px 0;
  font-size: var(--font-base);
  color: var(--text-secondary);
  line-height: 1.6;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.result-card ul li::before {
  content: '•';
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
}

.result-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
  padding-bottom: 24px;
}

.btn-action {
  flex: 1 1 auto;
  min-width: 100px;
  padding: 12px 16px;
  font-size: var(--font-sm);
  font-weight: 500;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 0.03em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.btn-action:active {
  transform: scale(0.96);
}

.btn-retry {
  background: var(--bg);
  color: var(--text-primary);
}

.btn-retry:hover {
  background: #e8e5ec;
}

.btn-copy {
  background: var(--accent-light);
  color: var(--accent-dark);
  font-weight: 600;
}

.btn-copy:hover {
  background: #dcd0eb;
}

.btn-screenshot {
  background: var(--accent);
  color: #fff;
  box-shadow: var(--shadow-btn);
}

.btn-screenshot:hover {
  background: var(--accent-dark);
}

.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text-primary);
  color: #fff;
  padding: 10px 24px;
  border-radius: 50px;
  font-size: var(--font-sm);
  font-weight: 500;
  z-index: 999;
  animation: toastIn 0.35s ease-out, toastOut 0.3s 1.5s ease-in forwards;
  pointer-events: none;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes toastOut {
  from { opacity: 1; }
  to   { opacity: 0; }
}

/* ===========================
   结果揭晓动画遮罩
   =========================== */
.reveal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  transition: opacity 0.8s ease;
}

.reveal-overlay.fade-out {
  opacity: 0;
  pointer-events: none;
}

.reveal-orb {
  width: 0;
  height: 0;
  border-radius: 50%;
  transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275),
              height 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.reveal-orb.expand {
  width: 140px;
  height: 140px;
}

.reveal-orb.pulse {
  animation: orbPulse 0.8s ease-in-out 0.6s;
}

@keyframes orbPulse {
  0% { box-shadow: 0 0 0 0 rgba(155, 126, 196, 0.4); }
  100% { box-shadow: 0 0 0 60px rgba(155, 126, 196, 0); }
}

.reveal-orb.burst {
  width: 200vmax;
  height: 200vmax;
  transition: width 0.7s ease-in, height 0.7s ease-in;
}

.reveal-name {
  font-size: 2rem;
  font-weight: 700;
  color: #fff;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  position: absolute;
  letter-spacing: 0.08em;
}

.reveal-name.show {
  opacity: 1;
  transform: translateY(0);
}

/* ===========================
   雷达图 Canvas
   =========================== */
.radar-card {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.radar-card canvas {
  max-width: 100%;
  height: auto;
}

/* ===========================
   呼吸引导动画
   =========================== */
.breathe-overlay {
  position: fixed;
  inset: 0;
  z-index: 150;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

.breathe-ring {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  animation: breathe 2.5s ease-in-out forwards;
}

@keyframes breathe {
  0%   { transform: scale(0.6); opacity: 0.4; box-shadow: 0 0 0 0 rgba(155,126,196,0.2); }
  50%  { transform: scale(1.6); opacity: 1;   box-shadow: 0 0 0 30px rgba(155,126,196,0); }
  100% { transform: scale(0.8); opacity: 0;   box-shadow: 0 0 0 0 rgba(155,126,196,0); }
}

.breathe-text {
  font-size: 1rem;
  color: var(--text-secondary);
  letter-spacing: 0.06em;
  animation: fadeInOut 2.5s ease-in-out forwards;
}

@keyframes fadeInOut {
  0%   { opacity: 0; transform: translateY(8px); }
  30%  { opacity: 1; transform: translateY(0); }
  80%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ===========================
   粒子画布
   =========================== */
#particle-canvas {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  width: 100%;
  height: 100%;
}

/* ===========================
   分享名片（隐藏元素，截图用）
   =========================== */
.stats-card {
  background: linear-gradient(135deg, var(--bg-card), var(--bg));
}

.stats-grid {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: space-around;
  margin: 12px 0;
}

.stat-item {
  text-align: center;
  flex: 1 1 80px;
  min-width: 80px;
}

.stat-number {
  font-size: 1.6rem;
  font-weight: 700;
  display: block;
  line-height: 1.2;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 4px;
  display: block;
  line-height: 1.4;
}

.stats-note {
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 8px;
}

.barnum-card {
  background: linear-gradient(135deg, #fdf8f3, #f8f4fd);
}

[data-theme="dark"] .barnum-card {
  background: linear-gradient(135deg, #2a2540, #252240);
}

.barnum-item {
  font-style: italic;
  color: var(--text-secondary);
  padding: 8px 0;
  line-height: 1.7;
  border-left: 3px solid var(--accent-light);
  padding-left: 16px;
  margin: 8px 0;
}

/* ===========================
   💰 变现模块样式
   =========================== */
.premium-card {

.qr-card {

}

.qr-item {

  flex: 0 0 auto;
}

/* ===========================

}

@keyframes fadeIn {

}

.share-guide-card {

.share-guide-actions button {

}

  background: var(--bg);

}

}

/* ===========================
   音效开关按钮
   =========================== */
.sound-toggle {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1.5px solid #e8e5ec;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: var(--transition);
}

.sound-toggle:hover {
  box-shadow: var(--shadow-md);
  transform: scale(1.06);
}

.sound-toggle:active {
  transform: scale(0.94);
}

/* 音乐开关 */
.music-toggle {
  position: fixed;
  bottom: 76px;
  right: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1.5px solid #e8e5ec;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: var(--transition);
}

.music-toggle:hover {
  box-shadow: var(--shadow-md);

}

.music-toggle:active {

let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playTone(freq, duration, type = 'sine', vol = 0.08) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch (e) {
    // 静默处理音频错误
  }
}

/* ============================================================
   🎵 背景音乐系统（程序化环境音乐）
   使用 Web Audio API 生成柔和氛围音乐
   ============================================================ */
let musicEnabled = false;
let musicPlaying = false;
let musicNodes = [];
let musicTimeout = null;

// 五声音阶（C大调）- 自然治愈的频率
const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 784.00];

// 和弦进行（根音序列）- 营造流动感
const CHORD_ROOTS = [0, 3, 2, 4, 0, 3, 2, 1]; // I vi ii V I vi ii iii 风格

function createAmbientPad(ctx, freq, startTime, duration, vol = 0.03) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  // 使用三角波 + 轻微失谐制造温暖质感
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, startTime);
  osc.frequency.linearRampToValueAtTime(freq * 1.002, startTime + duration); // 微失谐

  // 低通滤波让音色更柔和
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(800, startTime);
  filter.Q.setValueAtTime(0.5, startTime);

  // 音量包络：渐入渐出
  const fadeIn = Math.min(duration * 0.2, 1.5);
  const fadeOut = Math.min(duration * 0.3, 2);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(vol, startTime + fadeIn);
  gain.gain.setValueAtTime(vol, startTime + duration - fadeOut);
  gain.gain.linearRampToValueAtTime(0, startTime + duration);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  osc.start(startTime);
  osc.stop(startTime + duration);

  return { osc, gain, filter };
}

function createSparkle(ctx, freq, startTime, vol = 0.015) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, startTime);

  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(vol, startTime + 0.3);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + 2.5);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(startTime);
  osc.stop(startTime + 2.5);

  return { osc, gain };
}

function scheduleMusicPassage() {
  if (!musicEnabled) return;

  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const passageDuration = 12; // 每段 12 秒

  // 选择当前和弦根音（顺序循环）
  const chordIdx = Math.floor(now / passageDuration) % CHORD_ROOTS.length;
  const rootIdx = CHORD_ROOTS[chordIdx];
  const root = PENTATONIC[rootIdx % PENTATONIC.length];

  // 构建和弦音（根音 + 三度 + 五度 + 八度）
  const chord = [
    root,
    PENTATONIC[(rootIdx + 2) % PENTATONIC.length],
    PENTATONIC[(rootIdx + 4) % PENTATONIC.length],
    root * 2,
  ];

  // 铺底和弦
  chord.forEach((freq, i) => {
    createAmbientPad(ctx, freq, now + i * 0.15, passageDuration + 1, 0.025);
  });

  // 添加闪烁高音（随机从音阶中选）
  const sparkleCount = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < sparkleCount; i++) {
    const sparkleFreq = PENTATONIC[Math.floor(Math.random() * PENTATONIC.length)] * 2;
    const sparkleTime = now + 1 + Math.random() * (passageDuration - 2);
    createSparkle(ctx, sparkleFreq, sparkleTime, 0.012);
  }

  // 安排下一段
  musicTimeout = setTimeout(scheduleMusicPassage, passageDuration * 1000 - 200);
}

function startMusic() {
  if (musicPlaying) return;
  musicPlaying = true;

  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') {
    ctx.resume();
  }

  scheduleMusicPassage();
  $('#btn-music').classList.add('playing');
  $('#btn-music').textContent = '🎶';
}

function stopMusic() {
  musicPlaying = false;
  if (musicTimeout) {
    clearTimeout(musicTimeout);
    musicTimeout = null;
  }
  $('#btn-music').classList.remove('playing');
  $('#btn-music').textContent = '🎵';
}

/* ============================================================
   ✨ 粒子系统
   ============================================================ */
const particleCanvas = $('#particle-canvas');
const pCtx = particleCanvas.getContext('2d');
let particles = [];
let particleAnimId = null;

function resizeParticleCanvas() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
resizeParticleCanvas();
window.addEventListener('resize', resizeParticleCanvas);

function spawnParticles(x, y, color, count = 18) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015 + Math.random() * 0.03,
      size: 3 + Math.random() * 4,
      color,
    });
  }
  if (!particleAnimId) animateParticles();
}

function animateParticles() {
  pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

  particles = particles.filter(p => p.life > 0);
  if (particles.length === 0) {
    particleAnimId = null;
    return;
  }

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04; // 微重力
    p.life -= p.decay;
    p.size *= 0.985;

    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pCtx.fillStyle = p.color + Math.round(p.life * 255).toString(16).padStart(2, '0');
    pCtx.fill();
  });

  particleAnimId = requestAnimationFrame(animateParticles);
}

function loadProgress() {

   渲染答题页
   ============================================================ */
let isAnimating = false;

function renderQuestion(direction = 'next') {
  const q = QUESTIONS[state.currentQuestion];
  const total = QUESTIONS.length;
  const idx = state.currentQuestion + 1;
  const pct = Math.round((idx / total) * 100);

  // 更新进度条
  quizProgressLabel.textContent = `第 ${idx} / ${total} 题`;
  quizProgressPct.textContent = `${pct}%`;
  quizProgressFill.style.width = `${pct}%`;

  // 更新题目编号
  quizQNum.textContent = `Q${idx}`;

  // 切题动画
  const animClass = direction === 'next' ? 'slide-out-left' : 'slide-out-right';
  const animInClass = direction === 'next' ? 'slide-in-right' : 'slide-in-left';

  quizCard.classList.add(animClass);

  setTimeout(() => {
    // 更新题目内容
    quizQText.textContent = q.question;
    renderOptions();

    quizCard.classList.remove(animClass);
    quizCard.classList.add(animInClass);

    setTimeout(() => {
      quizCard.classList.remove(animInClass);
    }, 300);
  }, 250);

  // 更新导航按钮
  updateNavButtons();
}

function renderOptions() {
  const q = QUESTIONS[state.currentQuestion];
  const selectedIdx = state.answers[q.id];

  // 每个位置的默认图标
  const positionIcons = ['🌟', '💭', '🌿', '🚀'];

  quizOptions.innerHTML = q.options.map((opt, i) => {
    const isSelected = (selectedIdx === i);
    const icon = opt.icon || positionIcons[i % positionIcons.length];
    return `
      <button class="quiz-option${isSelected ? ' selected' : ''}"
              data-index="${i}" type="button"
              aria-selected="${isSelected}">
        <span class="quiz-option-icon">${icon}</span>
        <span class="quiz-option-radio"></span>
        <span class="quiz-option-text">${opt.text}</span>
      </button>
    `;
  }).join('');

  // 绑定点击事件
  quizOptions.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = parseInt(btn.dataset.index);
      selectOption(idx, e);
    });
  });
}

function selectOption(optionIndex, event) {
  const q = QUESTIONS[state.currentQuestion];
  state.answers[q.id] = optionIndex;

  // 更新 UI
  const allBtns = quizOptions.querySelectorAll('.quiz-option');
  allBtns.forEach((btn, i) => {
    btn.classList.toggle('selected', i === optionIndex);
    btn.setAttribute('aria-selected', i === optionIndex ? 'true' : 'false');
  });

  // ✨ 粒子效果
  if (event) {
    const rect = event.currentTarget.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const p = PERSONALITIES[state.resultPersonalityId] || PERSONALITIES[0];
    spawnParticles(cx, cy, '#9b7ec4', 16);
  }

  // 📳 触觉反馈
  haptic(10);

  sfxSelect();
  updateNavButtons();
  saveProgress();
}

function updateNavButtons() {
  const total = QUESTIONS.length;

  // 上一题按钮
  if (state.currentQuestion === 0) {
    btnPrev.style.visibility = 'hidden';
  } else {
    btnPrev.style.visibility = 'visible';
  }

  // 下一题按钮
  const q = QUESTIONS[state.currentQuestion];
  const hasAnswer = state.answers[q.id] !== undefined;

  if (state.currentQuestion === total - 1) {
    btnNext.textContent = '查看结果 ✨';
  } else {
    btnNext.textContent = '下一题 →';
  }
  btnNext.disabled = !hasAnswer;
}

function goNext() {
  const q = QUESTIONS[state.currentQuestion];
  if (state.answers[q.id] === undefined) return;
  if (isAnimating) return;

  if (state.currentQuestion < QUESTIONS.length - 1) {
    isAnimating = true;
    sfxNext();

    // 🌬️ 呼吸引导（每 5 题一次，避免太频繁）
    if ((state.currentQuestion + 1) % 5 === 0) {
      showBreatheGuide(() => {
        state.currentQuestion++;
        saveProgress();
        renderQuestion('next');
        setTimeout(() => { isAnimating = false; }, 350);
      });
    } else {
      state.currentQuestion++;
      saveProgress();
      renderQuestion('next');
      setTimeout(() => { isAnimating = false; }, 350);
    }
  } else {
    // 最后一题 → 计算结果
    sfxResult();
    haptic([20, 50, 20, 50, 40]);
    computeResult();
  }
}

function goPrev() {
  if (state.currentQuestion === 0) return;
  if (isAnimating) return;

  isAnimating = true;
  sfxPrev();
  state.currentQuestion--;
  saveProgress();
  renderQuestion('prev');
  setTimeout(() => { isAnimating = false; }, 350);
}

/* ============================================================
   评分计算
   ============================================================ */
function computeResult() {
  const scores = new Array(PERSONALITIES.length).fill(0);

  QUESTIONS.forEach(q => {
    const selectedIdx = state.answers[q.id];
    if (selectedIdx !== undefined) {
      const weightArr = q.options[selectedIdx].scores;
      weightArr.forEach((w, i) => {
        scores[i] += w;
      });
    }
  });

  // 找最高分
  let maxScore = -1;
  let maxIdx = 0;
  scores.forEach((s, i) => {
    if (s > maxScore) {
      maxScore = s;
      maxIdx = i;
    }
  });

  state.resultPersonalityId = maxIdx;
  saveProgress();
  recordCompletion(maxIdx); // 记录统计数据

  // 🎬 先播放揭晓动画，动画结束后渲染结果
  playRevealAnimation(maxIdx, () => {
    renderResult();
    showPage('result');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

/* ============================================================
   🎬 结果揭晓动画
   ============================================================ */
function playRevealAnimation(personalityId, onComplete) {
  const p = PERSONALITIES[personalityId];
  const overlay = $('#reveal-overlay');
  const orb = $('#reveal-orb');
  const nameEl = $('#reveal-name');

  // 重置
  orb.className = 'reveal-orb';
  orb.style.background = '';
  orb.style.boxShadow = '';
  nameEl.className = 'reveal-name';
  nameEl.textContent = '';
  overlay.classList.remove('fade-out');
  overlay.style.display = 'flex';

  // 阶段1：光点浮现 (0ms)
  setTimeout(() => {
    orb.style.background = `radial-gradient(circle, ${p.color}, ${p.color}cc)`;
    orb.classList.add('expand');
  }, 100);

  // 阶段2：光点脉动 + 炸开 (700ms)
  setTimeout(() => {
    orb.classList.add('pulse');
  }, 700);

  // 阶段3：颜色晕染全屏 + 显示名称 (1500ms)
  setTimeout(() => {
    orb.classList.remove('pulse');
    orb.classList.add('burst');
    orb.style.boxShadow = 'none';
    nameEl.textContent = p.name;
    nameEl.classList.add('show');
    nameEl.style.color = isLightColor(p.color) ? '#3a3548' : '#fff';
  }, 1500);

  // 阶段4：遮罩淡出，显露结果页 (2500ms)
  setTimeout(() => {
    overlay.classList.add('fade-out');
  }, 2500);

  // 阶段5：移除遮罩，执行回调 (3300ms)
  setTimeout(() => {
    overlay.style.display = 'none';
    if (onComplete) onComplete();
  }, 3300);
}

// 判断颜色是否为浅色（用于决定文字颜色）
function isLightColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 170;
}

/* ============================================================
   📊 雷达图绘制 (Canvas)
   ============================================================ */
function drawRadarChart(personalityId) {
  const canvas = $('#radar-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const p = PERSONALITIES[personalityId];
  const scores = DIMENSION_SCORES[personalityId];
  const dims = DIMENSION_LABELS;

  // 高清适配
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const displayW = Math.min(canvas.parentElement.clientWidth - 40, 520);
  const displayH = displayW * 0.8;
  canvas.style.width = displayW + 'px';
  canvas.style.height = displayH + 'px';
  canvas.width = displayW * dpr;
  canvas.height = displayH * dpr;
  ctx.scale(dpr, dpr);

  const w = displayW;
  const h = displayH;
  const cx = w / 2;
  const cy = h / 2 + 10;
  const radius = Math.min(w, h) * 0.32;
  const levels = 5;
  const n = dims.length;

  ctx.clearRect(0, 0, w, h);

  // 绘制网格
  for (let level = 1; level <= levels; level++) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      const r = (radius / levels) * level;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = level === levels ? '#d8d4de' : '#ece9f0';
    ctx.lineWidth = level === levels ? 1.5 : 0.8;
    ctx.fillStyle = level % 2 === 0 ? 'rgba(155, 126, 196, 0.03)' : 'transparent';
    ctx.fill();
    ctx.stroke();
  }

  // 绘制轴线
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + radius * Math.cos(angle), cy + radius * Math.sin(angle));
    ctx.strokeStyle = '#e8e5ec';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // 绘制数据区域
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    const r = (radius * scores[i]) / 100;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = p.color + '30';
  ctx.fill();
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // 绘制数据点
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    const r = (radius * scores[i]) / 100;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // 绘制标签
  ctx.fillStyle = '#5a5568';
  ctx.font = '600 12px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    const labelR = radius + 28;
    const x = cx + labelR * Math.cos(angle);
    const y = cy + labelR * Math.sin(angle);
    ctx.fillText(dims[i] + ' ' + scores[i], x, y);
  }
}

    const canvas = await html2canvas(card, {

      scale: 2,
      useCORS: true,
    });

    // 下载
    const link = document.createElement('a');
    link.download = `my-color-${PERSONALITIES[state.resultPersonalityId].name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('📸 专属名片已保存！发朋友圈吧～');
  } catch (e) {
    showToast('⚠️ 生成失败，请重试或直接截图');
  }

  // 隐藏回去
  card.style.left = '-9999px';
  card.style.top = '0';
  card.style.zIndex = '';
}
function getResultText() {
  const p = PERSONALITIES[state.resultPersonalityId];
  return `🎨 我的内在色彩：${p.name}\n\n"${p.tagline}"\n\n核心特质：${p.traits.join(' · ')}\n\n🌟 优势：\n${p.strengths}\n\n🌱 成长空间：\n${p.weaknesses}\n\n💛 相处建议：\n${p.advice.replace(/\n/g, '\n')}\n\n—— 色彩人格测试 · 发现你的内在颜色`;
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

async function copyResult() {
  try {
    await navigator.clipboard.writeText(getResultText());
    showToast('✅ 结果已复制，分享给朋友吧～');
  } catch (e) {
    // 降级方案
    const textarea = document.createElement('textarea');
    textarea.value = getResultText();
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    showToast('✅ 结果已复制，分享给朋友吧～');
  }
}

async function screenshotResult() {
  showToast('📸 正在生成截图...');
  try {
    const el = resultContent;
    const canvas = await html2canvas(el, {
      backgroundColor: '#f9f7f4',
      scale: 2,
      useCORS: true,
    });
    // 下载
    const link = document.createElement('a');
    link.download = 'my-color-personality.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('📸 截图已保存！');
  } catch (e) {
    // html2canvas 未加载时的降级
    showToast('⚠️ 截图功能加载中，请稍后再试或直接截图');
  }
}

function retryTest() {
  state.currentQuestion = 0;
  state.answers = {};
  state.resultPersonalityId = null;
  clearProgress();
  showPage('welcome');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 结果页事件委托
resultContent.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.classList.contains('btn-copy')) {
    copyResult();
  } else if (btn.classList.contains('btn-screenshot')) {
    screenshotResult();
  } else if (btn.classList.contains('btn-retry')) {
    retryTest();
  }
});

/* ============================================================
   事件绑定
   ============================================================ */
btnStart.addEventListener('click', () => {
  state.currentQuestion = 0;
  state.answers = {};
  state.resultPersonalityId = null;

  // 尝试恢复之前的进度
  const saved = loadProgress();
  if (saved && saved.answers && Object.keys(saved.answers).length > 0 && !saved.resultPersonalityId) {
    // 有未完成的答题
    if (confirm('检测到上次未完成的答题进度，是否继续？\n（选择"取消"将重新开始）')) {
      state.currentQuestion = saved.currentQuestion || 0;
      state.answers = saved.answers || {};
    }
  }

  showPage('quiz');
  renderQuestion('next');
  updateNavButtons();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

btnNext.addEventListener('click', goNext);
btnPrev.addEventListener('click', goPrev);

// 键盘支持
document.addEventListener('keydown', (e) => {
  if (state.currentPage !== 'quiz') return;

  if (e.key === 'Enter' || e.key === 'ArrowRight') {
    e.preventDefault();
    goNext();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goPrev();
  } else if (e.key >= '1' && e.key <= '4') {
    const idx = parseInt(e.key) - 1;
    if (idx < QUESTIONS[state.currentQuestion].options.length) {
      selectOption(idx); // 键盘触发，无鼠标位置粒子
    }
  }
});

/* ============================================================
   结果页渲染（每次切换到结果页时）
   ============================================================ */
const origShowPage = showPage;
showPage = function(pageName) {
  origShowPage(pageName);
  if (pageName === 'result') {
    renderResultActions();
  }
};

function renderResultActions() {
  // 在最后一个 result-card 后添加操作按钮
  const lastCard = resultContent.querySelector('.result-card:last-of-type');
  if (!lastCard) return;

  // 避免重复添加
  if (resultContent.querySelector('.result-actions')) return;

  const actions = document.createElement('div');
  actions.className = 'result-actions';
  actions.innerHTML = `
    <button class="btn-action btn-retry" type="button">🔄 重新测试</button>
    <button class="btn-action btn-copy" type="button">📋 复制结果</button>
    <button class="btn-action btn-screenshot" type="button">📸 截图保存</button>
  `;
  lastCard.insertAdjacentElement('afterend', actions);

  // 显示分享浮动按钮
  const floatBtn = $('#share-float-btn');
  if (floatBtn) floatBtn.style.display = 'flex';

  // 5 秒后弹出分享引导（仅首次）
  const hasSeenGuide = sessionStorage.getItem('seen-share-guide');
  if (!hasSeenGuide) {
    setTimeout(() => {
      showShareGuide();
      sessionStorage.setItem('seen-share-guide', '1');
    }, 5000);
  }
}

/* ============================================================
   📤 分享引导弹窗
   ============================================================ */
function showShareGuide() {
  const overlay = $('#share-guide-overlay');
  if (!overlay) return;
  overlay.style.display = 'flex';
}

function hideShareGuide() {
  const overlay = $('#share-guide-overlay');
  if (overlay) overlay.style.display = 'none';
}

// 弹窗中的截图按钮
$('#btn-screenshot-guide').addEventListener('click', () => {
  hideShareGuide();
  screenshotResult();
});

// 关闭弹窗
$('#btn-close-guide').addEventListener('click', hideShareGuide);

// 点击遮罩关闭
$('#share-guide-overlay').addEventListener('click', (e) => {
  if (e.target === $('#share-guide-overlay')) hideShareGuide();
});

// 浮动分享按钮点击
const shareFloatBtn = $('#share-float-btn');
if (shareFloatBtn) {
  shareFloatBtn.addEventListener('click', showShareGuide);
}

/* ============================================================
   📱 PWA 支持 — 可添加到主屏幕
   ============================================================ */
(function setupPWA() {
  // 创建 Manifest 对象
  const manifest = {
    name: '色彩人格测试',
    short_name: '人格测试',
    description: '发现你的内在颜色 — 趣味专业人格心理测试',
    start_url: location.href,
    display: 'standalone',
    background_color: '#f9f7f4',
    theme_color: '#9b7ec4',
    orientation: 'portrait-primary',
    icons: [{
      src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#9b7ec4"/><text x="96" y="116" text-anchor="middle" font-size="96" fill="white">🎨</text></svg>'),
      sizes: '192x192',
      type: 'image/svg+xml',
      purpose: 'any maskable'
    }]
  };

  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  // 注册 Service Worker（离线缓存）
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'personality-test-v2';
      self.addEventListener('install', e => {
        e.waitUntil(
          caches.open(CACHE).then(c => c.addAll([self.location.href]))
        );
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(caches.keys().then(keys =>
          Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
        ));
        self.clients.claim();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request))
        );
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swURL = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swURL).catch(() => {
      // Service Worker 注册失败不影响主功能
    });
  }
})();

/* ============================================================
   初始化：检查是否有保存的结果
   ============================================================ */
(function init() {
  const saved = loadProgress();
  if (saved && saved.resultPersonalityId !== null && saved.resultPersonalityId !== undefined) {
    // 有已完成的结果，直接展示
    state.resultPersonalityId = saved.resultPersonalityId;
    state.answers = saved.answers || {};
    renderResult();
    showPage('result');
  }
  // 否则停留在欢迎页
})();
